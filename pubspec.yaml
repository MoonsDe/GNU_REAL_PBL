name: gnu_real_pbl
description: "A new Flutter project."
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.5.0 # (수정됨) Flutter 3.24 이상에 맞는 Dart SDK 버전으로 조정

dependencies:
  flutter:
    sdk: flutter

  # 카메라 기능
  camera: ^0.11.0 # (권장) 최신 안정 버전으로 업데이트

  # 갤러리 이미지 선택 기능
  image_picker: ^1.1.2 # (권장) 최신 안정 버전으로 업데이트

  # HTTP 통신 (서버 연동)
  dio: ^5.7.0 # (추가됨) 서버 통신을 위해 필수

  # iOS 스타일 아이콘
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  # 린트 설정 (버전 호환성을 위해 4.0.0 권장)
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
